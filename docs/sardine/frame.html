<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <title>Sardine collector frame</title>
  <script>
(function () {
  const PARENT = window.parent;
  const ORIGIN = location.origin;

  function isSentry(url) {
    return /sentry\.io|ingest\.sentry/i.test(String(url || ""));
  }

  function isSardineHost(url) {
    return /(?:^|\.)sardine\.ai/i.test(String(url || ""))
      || /live-harbor\.com/i.test(String(url || ""));
  }

  function isEventsUpload(method, url) {
    return String(method || "GET").toUpperCase() === "POST"
      && /\/v1\/events(?:\/|$|\?)/i.test(String(url || ""))
      && isSardineHost(url);
  }

  function isBlockedUpload(url) {
    const u = String(url || "");
    if (isSentry(u)) return true;
    if (isSardineHost(u) && /\/v1\//i.test(u)) return true;
    if (/p\.live-harbor\.com/i.test(u)) return true;
    if (/live-harbor\.com.*\.(png|jpg|gif)/i.test(u)) return true;
    return false;
  }

  function emitCapture(obj) {
    if (!obj || typeof obj !== "object") return;
    const pl = obj.payload;
    if (!Array.isArray(pl) || pl.length < 8) return;
    if (window.__sardineCaptured) return;
    window.__sardineCaptured = true;
    try {
      PARENT.postMessage({ type: "sardine-capture", data: obj }, ORIGIN);
    } catch (e) {
      console.warn("[sardine-frame] postMessage failed", e);
    }
  }

  async function decodeSardineWire(buf) {
    const u8 = buf instanceof ArrayBuffer ? new Uint8Array(buf) : new Uint8Array(buf.buffer || buf);
    const gz = new Uint8Array(u8.length);
    for (let i = 0; i < u8.length; i++) gz[i] = (u8[i] ^ i) & 0xff;
    const ds = new DecompressionStream("gzip");
    const out = await new Response(new Blob([gz]).stream().pipeThrough(ds)).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(out));
  }

  function fakeEventsResponse() {
    return JSON.stringify({
      deviceId: crypto.randomUUID ? crypto.randomUUID() : "fp-capture-local",
      deviceToken: "capture-" + Math.random().toString(36).slice(2),
    });
  }

  async function swallowEventsUpload(body) {
    if (!body) return;
    try {
      let buf = body;
      if (body instanceof Blob) buf = await body.arrayBuffer();
      else if (ArrayBuffer.isView(body)) buf = body.buffer.slice(body.byteOffset, body.byteOffset + body.byteLength);
      emitCapture(await decodeSardineWire(buf));
    } catch (e) {
      console.warn("[sardine-frame] wire decode failed", e);
    }
  }

  const _stringify = JSON.stringify;
  JSON.stringify = function (value, ...rest) {
    if (value && typeof value === "object" && Array.isArray(value.payload)) {
      emitCapture(value);
    }
    return _stringify.apply(this, [value, ...rest]);
  };

  const xhrOpen = XMLHttpRequest.prototype.open;
  const xhrSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    this.__capUrl = url;
    this.__capMethod = (method || "GET").toUpperCase();
    return xhrOpen.call(this, method, url, ...rest);
  };
  XMLHttpRequest.prototype.send = function (body) {
    const url = this.__capUrl || "";
    const xhr = this;
    if (isSentry(url) || isBlockedUpload(url)) {
      queueMicrotask(finishXhr);
      return;
    }
    if (isEventsUpload(this.__capMethod, url)) {
      swallowEventsUpload(body).finally(finishXhr);
      return;
    }
    return xhrSend.call(this, body);

    function finishXhr() {
      Object.defineProperty(xhr, "readyState", { configurable: true, value: 4 });
      Object.defineProperty(xhr, "status", { configurable: true, value: isEventsUpload(xhr.__capMethod, url) ? 200 : 204 });
      Object.defineProperty(xhr, "responseText", {
        configurable: true,
        value: isEventsUpload(xhr.__capMethod, url) ? fakeEventsResponse() : "",
      });
      xhr.onreadystatechange && xhr.onreadystatechange();
      xhr.onload && xhr.onload();
    }
  };

  const origFetch = window.fetch.bind(window);
  window.fetch = async function (input, init) {
    const url = typeof input === "string" ? input : (input && input.url) || "";
    const method = ((init && init.method) || "GET").toUpperCase();
    if (isSentry(url) || isBlockedUpload(url)) {
      return new Response("", { status: 204 });
    }
    if (isEventsUpload(method, url)) {
      if (init && init.body) await swallowEventsUpload(init.body);
      return new Response(fakeEventsResponse(), { status: 200, headers: { "content-type": "application/json" } });
    }
    return origFetch(input, init);
  };

  if (navigator.sendBeacon) {
    const _beacon = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function (url, data) {
      if (isSardineHost(url) || isSentry(url)) return true;
      return _beacon(url, data);
    };
  }

  const OrigWS = window.WebSocket;
  window.WebSocket = function (url, protocols) {
    if (isSardineHost(url)) {
      return {
        readyState: 1, CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3,
        send() {}, close() {},
        addEventListener(ev, fn) { if (ev === "open") queueMicrotask(() => fn({ type: "open" })); },
        removeEventListener() {},
      };
    }
    return new OrigWS(url, protocols);
  };

  const imgSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  if (imgSrc && imgSrc.set) {
    Object.defineProperty(HTMLImageElement.prototype, "src", {
      set(v) {
        if (isSardineHost(v) || /p\.live-harbor\.com/i.test(String(v))) {
          queueMicrotask(() => this.onload && this.onload());
          return;
        }
        imgSrc.set.call(this, v);
      },
      get() { return imgSrc.get.call(this); },
      configurable: true,
    });
  }
})();
  </script>
  <script type="module" src="https://api.live-harbor.com/assets/collector.min.d6170a0.js"></script>
</head>
<body></body>
</html>
