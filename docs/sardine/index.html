<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sardine probe capture</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
           margin: 0; padding: 20px 16px 60px; background: #0b0f14; color: #e6edf3; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    .sub { color: #7d8590; font-size: 12px; margin: 0 0 20px; line-height: 1.5; }
    .nav { margin: 0 0 16px; font-size: 12px; }
    .nav a { color: #58a6ff; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 16px 12px; font-size: 15px; font-weight: 600;
             border: 0; border-radius: 10px; background: #238636; color: #fff;
             font-family: inherit; -webkit-appearance: none; }
    button.secondary { background: #21262d; color: #e6edf3; }
    button:active { filter: brightness(0.92); }
    button[disabled] { background: #30363d; color: #7d8590; }
    #go { width: 100%; flex: none; padding: 18px; font-size: 17px; }
    #status { font-size: 13px; margin: 16px 0; min-height: 20px; line-height: 1.5; }
    .ok { color: #3fb950; } .warn { color: #d29922; } .err { color: #f85149; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 12px 0; }
    td { padding: 5px 6px; border-bottom: 1px solid #21262d; vertical-align: top; }
    td:first-child { color: #7d8590; width: 34%; }
    td:last-child { word-break: break-all; }
    pre { background: #161b22; padding: 12px; overflow: auto; border-radius: 8px;
          font-size: 10px; white-space: pre-wrap; word-break: break-all; color: #8b949e; }
    label { display: block; font-size: 11px; color: #7d8590; margin: 12px 0 4px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #30363d; background: #161b22; color: #e6edf3; font: inherit; font-size: 12px; }
    code { color: #79c0ff; }
  </style>
</head>
<body>
  <p class="nav"><a href="../">← All collectors</a> · <a href="../fp/">Laylo FP</a></p>
  <h1>Sardine probe capture</h1>
  <p class="sub">
    Runs the same <strong>OfflineAudioContext</strong> + <strong>WebGL image hash</strong> probes
    Sardine's collector uses (sha512 of the WebGL canvas PNG). Works on GitHub Pages — tap
    <em>Capture</em>, then Copy / Download / webhook. One capture per machine/GPU is enough.
  </p>

  <button id="go">Capture Sardine probes</button>
  <div class="row" id="actions" hidden>
    <button class="secondary" id="copy" type="button">Copy JSON</button>
    <button class="secondary" id="copyProbe" type="button">Copy probe_bank snippet</button>
    <button class="secondary" id="dl" type="button">Download .json</button>
  </div>

  <label for="webhook">Optional webhook (Discord / webhook.site) — leave blank to skip</label>
  <input id="webhook" type="text" placeholder="https://discord.com/api/webhooks/... or https://webhook.site/..." autocomplete="off" />

  <p id="status"></p>
  <div id="summary"></div>
  <pre id="out" hidden></pre>

<script>
// Same webhook as Laylo page — override via ?webhook= or the input below.
const HARDCODED_WEBHOOK = "https://discord.com/api/webhooks/1509692975037550715/tnCh-dHyzgP1wFYwT4BRXgtqP-ATClVbwSoVHYIFmuijkWreUMnJ2gumvQnj0lPZFu4b";

/** Sardine collector ax() — OfflineAudioContext sum (samples 4500–4999). */
async function audioProbe() {
  const context = new OfflineAudioContext(1, 5000, 44100);
  const oscillator = context.createOscillator();
  oscillator.type = "triangle";
  oscillator.frequency.setValueAtTime(10000, context.currentTime);
  const compressor = context.createDynamicsCompressor();
  for (const [k, v] of [
    ["threshold", -50], ["knee", 40], ["ratio", 12], ["attack", 0], ["release", 0.25],
  ]) {
    compressor[k].setValueAtTime(v, context.currentTime);
  }
  oscillator.connect(compressor);
  compressor.connect(context.destination);
  oscillator.start(0);
  const buffer = await context.startRendering();
  const data = buffer.getChannelData(0);
  let sum = 0;
  for (let i = 4500; i < 5000; i++) sum += Math.abs(data[i]);
  return sum.toFixed(14);
}

/** Sardine collector WebGL shader + sha512(dataUrl) image hash. */
function webglProbe() {
  const width = 300, height = 150;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
  if (!gl) return { error: "no webgl" };

  const vsSrc =
    "attribute vec2 attrVertex;varying vec2 varyinTexCoordinate;uniform vec2 uniformOffset;void main(){varyinTexCoordinate=attrVertex+uniformOffset;gl_Position=vec4(attrVertex,0,1);}";
  const fsSrc =
    "precision mediump float;varying vec2 varyinTexCoordinate;void main(){gl_FragColor=vec4(varyinTexCoordinate,0,1);}";

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    return sh;
  }

  gl.clearColor(0, 0, 0, 1);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const vs = compile(gl.VERTEX_SHADER, vsSrc);
  const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const verts = new Float32Array([
    -0.2, -0.9, 0, 0.4, -0.26, 0, 0, 0.732134444, 0,
  ]);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, "attrVertex");
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 0, 0);
  const off = gl.getUniformLocation(prog, "uniformOffset");
  gl.uniform2f(off, 1, 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const dataUrl = canvas.toDataURL("image/png");
  const ext = gl.getExtension("WEBGL_debug_renderer_info");
  return {
    dataUrl,
    dataUrlLen: dataUrl.length,
    pngBytes: Math.floor((dataUrl.split(",")[1].length * 3) / 4),
    vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : null,
    renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : null,
    maskedVendor: gl.getParameter(gl.VENDOR),
    maskedRenderer: gl.getParameter(gl.RENDERER),
    version: gl.getParameter(gl.VERSION),
  };
}

async function sha512Hex(text) {
  const buf = await crypto.subtle.digest("SHA-512", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function detectPlatform(ua) {
  const l = (ua || "").toLowerCase();
  if (/iphone|ipad|ipod/.test(l)) return "ios";
  if (/android/.test(l)) return "android";
  if (/macintosh|mac os x/.test(l)) return "mac";
  if (/linux/.test(l) && !/android/.test(l)) return "linux";
  if (/windows/.test(l)) return "win64";
  return "unknown";
}

function gpuSlug(renderer) {
  const r = (renderer || "unknown").toLowerCase();
  const m = r.match(/geforce\s+rtx\s+(\d+)/i) || r.match(/radeon\s+rx\s+(\w+)/i)
    || r.match(/intel\(r\)\s+(\w+)/i) || r.match(/apple\s+m(\d+)/i);
  if (m) return m[0].replace(/\s+/g, "-").replace(/[()]/g, "");
  return r.replace(/[^a-z0-9]+/g, "-").slice(0, 40).replace(/^-|-$/g, "") || "gpu";
}

function deviceSlug(ua) {
  const l = (ua || "").toLowerCase();
  const parts = [];
  if (/iphone/.test(l)) parts.push("iphone");
  else if (/ipad/.test(l)) parts.push("ipad");
  else if (/android/.test(l)) parts.push("android");
  else if (/windows/.test(l)) parts.push("windows");
  else if (/mac/.test(l)) parts.push("mac");
  else parts.push("unknown");
  if (/edg\//.test(l)) parts.push("edge");
  else if (/chrome\//.test(l)) parts.push("chrome");
  else if (/firefox\//.test(l)) parts.push("firefox");
  else if (/safari/.test(l)) parts.push("safari");
  return parts.join("-");
}

function probeBankSnippet(audio, webglImageHash, meta) {
  const platform = meta.platform || "win64";
  return {
    default_tls_client: "chrome_133_PSK",
    webgl_mode: "match_gpu",
    chrome_133_PSK: {
      [platform]: {
        audio,
        webglImageHash,
        _captured_from: {
          userAgent: meta.userAgent,
          webglVendor: meta.webglVendor,
          webglRenderer: meta.webglRenderer,
          capturedAt: meta.capturedAt,
          host: meta.host,
          gpuKey: meta.gpuKey,
        },
      },
    },
  };
}

function webhookURL() {
  const q = new URLSearchParams(location.search).get("webhook");
  const input = document.getElementById("webhook").value.trim();
  return input || q || HARDCODED_WEBHOOK || "";
}

(() => {
  const q = new URLSearchParams(location.search).get("webhook");
  if (q) document.getElementById("webhook").value = q;
})();

const set = (h) => { document.getElementById("status").innerHTML = h; };
let lastPayload = null;
let lastProbeSnippet = null;

async function capture() {
  const btn = document.getElementById("go");
  btn.disabled = true;
  set("Running OfflineAudioContext + WebGL probes…");

  let audio = null;
  let wg = null;
  let webglImageHash = null;
  const errors = [];

  try {
    audio = await audioProbe();
  } catch (e) {
    errors.push("audio: " + (e.message || e));
  }

  try {
    wg = webglProbe();
    if (wg.error) errors.push("webgl: " + wg.error);
    else if (wg.dataUrl) webglImageHash = await sha512Hex(wg.dataUrl);
  } catch (e) {
    errors.push("webgl: " + (e.message || e));
  }

  const ua = navigator.userAgent;
  const platform = detectPlatform(ua);
  const gpuKey = gpuSlug(wg && wg.renderer);
  const capturedAt = new Date().toISOString();

  const meta = {
    userAgent: ua,
    platform,
    webglVendor: wg && wg.vendor,
    webglRenderer: wg && wg.renderer,
    capturedAt,
    host: location.host || "file",
    gpuKey,
  };

  lastProbeSnippet = probeBankSnippet(audio, webglImageHash, meta);

  const payload = {
    kind: "sardine_probe",
    capturedAt,
    host: location.host || "file",
    secureContext: window.isSecureContext,
    audio,
    webglImageHash,
    webgl: wg ? {
      vendor: wg.vendor,
      renderer: wg.renderer,
      maskedVendor: wg.maskedVendor,
      maskedRenderer: wg.maskedRenderer,
      version: wg.version,
      dataUrlLen: wg.dataUrlLen,
      pngBytes: wg.pngBytes,
    } : null,
    nav: {
      ua,
      platform: navigator.platform,
      vendor: navigator.vendor,
      languages: navigator.languages || [navigator.language],
      hardwareConcurrency: navigator.hardwareConcurrency || 0,
      deviceMemory: navigator.deviceMemory ?? null,
    },
    screen: {
      width: screen.width, height: screen.height,
      colorDepth: screen.colorDepth,
      dpr: window.devicePixelRatio || 1,
    },
    tz: {
      iana: Intl.DateTimeFormat().resolvedOptions().timeZone,
      offset: new Date().getTimezoneOffset(),
    },
    probeBankSnippet: lastProbeSnippet,
    gpuKey,
    platform,
    errors: errors.length ? errors : undefined,
  };
  lastPayload = payload;

  document.getElementById("out").hidden = false;
  document.getElementById("out").textContent = JSON.stringify(payload, null, 2);
  document.getElementById("actions").hidden = false;

  const rows = [
    ["audio", audio || "(failed)"],
    ["webglImageHash", webglImageHash ? webglImageHash.slice(0, 24) + "…" : "(failed)"],
    ["gpu", (wg && wg.renderer) || "(hidden)"],
    ["platform", platform],
    ["gpu key", gpuKey],
    ["secure ctx", payload.secureContext ? "yes" : "no — use https"],
  ];
  document.getElementById("summary").innerHTML =
    "<table>" + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("") + "</table>";

  const notes = [];
  if (errors.length) notes.push(`<span class="err">${errors.join("; ")}</span>`);

  const wh = webhookURL();
  if (wh) {
    try {
      const isDiscord = /discord(?:app)?\.com\/api\/webhooks\//i.test(wh);
      const compact = {
        kind: "sardine_probe",
        gpu: wg && wg.renderer,
        audio,
        webglImageHash,
        platform,
        gpuKey,
        ua: ua.slice(0, 120),
        capturedAt,
      };
      const body = isDiscord
        ? JSON.stringify({
            content: `Sardine probe · ${gpuKey} · ${platform}`,
            embeds: [{
              title: (wg && wg.renderer) || gpuKey,
              description: "```json\n" + JSON.stringify(compact, null, 2).slice(0, 3500) + "\n```",
            }],
          })
        : JSON.stringify(payload);
      const res = await fetch(wh, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body,
      });
      if (res.ok || res.status === 204) notes.push('<span class="ok">Sent to webhook</span>');
      else notes.push(`<span class="warn">Webhook HTTP ${res.status}</span>`);
    } catch (e) {
      notes.push(`<span class="warn">Webhook failed (${e.message || e})</span>`);
    }
  }

  if (!notes.length) {
    notes.push('<span class="ok">Done.</span> Copy or Download the JSON.');
  }
  set(notes.join(" · "));
  btn.disabled = false;
  btn.textContent = "Capture again";
}

document.getElementById("go").onclick = capture;
document.getElementById("copy").onclick = async () => {
  if (!lastPayload) return;
  const text = JSON.stringify(lastPayload, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    set('<span class="ok">Copied full JSON.</span>');
  } catch {
    set('<span class="warn">Clipboard blocked — select the JSON below.</span>');
  }
};
document.getElementById("copyProbe").onclick = async () => {
  if (!lastProbeSnippet) return;
  const text = JSON.stringify(lastProbeSnippet, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    set('<span class="ok">Copied probe_bank snippet.</span>');
  } catch {
    set('<span class="warn">Clipboard blocked.</span>');
  }
};
document.getElementById("dl").onclick = () => {
  if (!lastPayload) return;
  const name = `sardine-${new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19)}-${gpuSlug(lastPayload.webgl && lastPayload.webgl.renderer)}.json`;
  const blob = new Blob([JSON.stringify(lastPayload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  set(`<span class="ok">Downloaded ${name}</span>`);
};
</script>
</body>
</html>
